<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume Builder - 9to5 University</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Removed non-existent resume-builder.css reference -->
    <script>
        // Add fallback for CDN failures
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.includes('cdnjs.cloudflare.com')) {
                console.warn('CDN resource failed to load:', e.filename);
                // Show user-friendly message
                const fallbackMsg = document.createElement('div');
                fallbackMsg.innerHTML = 'Some features may be limited due to network issues. Please check your connection.';
                fallbackMsg.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; background: #ff6b6b; color: white; padding: 10px; text-align: center; z-index: 9999;';
                document.body.appendChild(fallbackMsg);
                setTimeout(() => fallbackMsg.remove(), 5000);
            }
        }, true);
    </script>
</head>
<body>
    <!-- Rest of your HTML content remains the same -->
</body>
</html>
